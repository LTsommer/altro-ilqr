# Solver tuning for the motion planning example.
projection_method=riccati

# Terms are evaluated in the order listed here.
costs=lat_acc,lat_jerk,dot_kappa,jerk,offset,target_speed,comfort_dist
constraints=acc,jerk,curve,lat_acc,lat_jerk,safe,heading,vel,speed_limit

weight.ref_offset=3000.0
weight.vel_diff=1000.0
# Preserved configuration field. mp does not register a control bound term.
weight.u=1.0
weight.clb=1.0
weight.cub=1.0
weight.plb=2.0
weight.prb=2.0
weight.lat_jerk=50.0
weight.lat_acc=50.0
weight.jerk=1000.0
weight.dot_kappa=1000.0
weight.comfort_dist=3000.0

# Preserved control limits. mp does not use these two limits.
limit.u_min=-0.1
limit.u_max=0.1
limit.yaw_diff_min=-0.1
limit.yaw_diff_max=0.1
limit.kappa_min=-0.15
limit.kappa_max=0.15
limit.acc_min=-2.0
limit.acc_max=4.0
limit.lat_jerk_min=-5.0
limit.lat_jerk_max=5.0
limit.lat_acc_min=-2.0
limit.lat_acc_max=2.0
limit.jerk_min=-7.0
limit.jerk_max=7.0
limit.vel_min=0.0
limit.vel_max=100.0

constraint.acc.dual=0.1
constraint.acc.penalty=1
constraint.jerk.dual=0.0
constraint.jerk.penalty=1
constraint.curve.dual=2.0
constraint.curve.penalty=10.0
constraint.lat_acc.dual=0.0
constraint.lat_acc.penalty=1
constraint.lat_jerk.dual=0.0
constraint.lat_jerk.penalty=1.0
constraint.safe.dual=10.0
constraint.safe.penalty=20.0
constraint.heading.dual=1.0
constraint.heading.penalty=10.0
constraint.vel.dual=0.0
constraint.vel.penalty=1.0
constraint.speed_limit.dual=0.0
constraint.speed_limit.penalty=10.0
