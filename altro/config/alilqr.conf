# Solver tuning for the curvature smoothing example.
projection_method=riccati

# Terms are evaluated in the order listed here.
costs=offset,curvature,lateral_comfort,comfort_dist
constraints=safe,control,heading,kappa

weight.ref_offset=3000.0
weight.kappa=1000.0
weight.dkappa=1000.0
weight.u=1000.0
weight.clb=1.0
weight.cub=1.0
weight.plb=2.0
weight.prb=2.0
weight.jerk=10.0
weight.acc=10.0
weight.comfort_dist=3000.0

limit.u_min=-5.0
limit.u_max=5.0
limit.yaw_diff_min=-0.1
limit.yaw_diff_max=0.1
limit.kappa_min=-0.15
limit.kappa_max=0.15

constraint.safe.dual=10.0
constraint.safe.penalty=10.0
constraint.control.dual=1
constraint.control.penalty=1
constraint.heading.dual=10
constraint.heading.penalty=20
constraint.kappa.dual=10
constraint.kappa.penalty=100
